<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Нексо" />
    
    <!-- Apple iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Нексо" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/logo.png" />
    
    <!-- Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Windows -->
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-TileImage" content="/logo.png" />
    
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Нексо</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Russo+One&display=swap" rel="stylesheet" />
    <style>
      @font-face {
        font-family: 'PreschoolPlayhouse';
        src: url('/fonts/PreschoolPlayhouse.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Koganejidainogemu';
        src: url('/fonts/Koganejidainogemu.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'JF Dot Shinonome Gothic 14';
        src: url('/fonts/JF-Dot-Shinonome14.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'JF Dot Shinonome Gothic 14';
        src: url('/fonts/JF-Dot-Shinonome14B.ttf') format('truetype');
        font-weight: bold;
        font-style: normal;
        font-display: swap;
      }
    </style>

    <!-- Preload critical fonts (JF-Dot Shinonome 14/14B не используются в UI —
         их preload тянул ~3.4MB при каждом старте) -->
    <link rel="preload" as="font" href="/fonts/Koganejidainogemu.ttf" crossorigin fetchpriority="high" />
    <link rel="preload" as="font" href="/fonts/PreschoolPlayhouse.ttf" crossorigin />

    </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
