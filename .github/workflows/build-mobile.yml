name: Build Нексо Mobile Apps (APK & IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
        
      - name: Build web app
        working-directory: frontend
        run: npm run build
        
      - name: Strip heavy static assets from dist (app loads from server)
        working-directory: frontend
        run: |
          rm -rf dist/animated-emojis
          rm -rf dist/stickers
          rm -rf dist/auth-gifs
          echo "dist size after cleanup:"
          du -sh dist/
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Capacitor Android
        working-directory: frontend
        run: |
          npx cap sync android
          
      - name: Build Android APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Нексо-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
        
      - name: Build web app
        working-directory: frontend
        run: npm run build
        
      - name: Strip heavy static assets from dist (app loads from server)
        working-directory: frontend
        run: |
          rm -rf dist/animated-emojis
          rm -rf dist/stickers
          rm -rf dist/auth-gifs
          echo "dist size after cleanup:"
          du -sh dist/
          
      - name: Install Capacitor iOS
        working-directory: frontend
        run: |
          npx cap sync ios
          
      - name: Build iOS App
        working-directory: frontend/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -sdk iphoneos -configuration Debug build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -derivedDataPath build
          
      - name: Create IPA
        working-directory: frontend/ios/App
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "App.app" -type d | head -1)
          cp -r "$APP_PATH" Payload/
          zip -r "Нексо.ipa" Payload
          rm -rf Payload
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Нексо-iOS-IPA
          path: frontend/ios/App/Нексо.ipa
