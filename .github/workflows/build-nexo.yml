name: Build Нексо Desktop App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build macOS app with Pake
        run: |
          npx pake-cli https://nexo.hakerone.ru --name Nexo --icon frontend/public/logo.png --width 1200 --height 800 --hide-title-bar --title "Нексо"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Нексо-macOS
          path: '*.dmg'

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Windows app with Pake
        run: |
          npx pake-cli https://nexo.hakerone.ru --name Nexo --icon frontend/public/logo.png --width 1200 --height 800 --hide-window-decorations --title "Нексо" --installer-language ru-RU

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Нексо-Windows
          path: '*.msi'

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build Linux app with Pake
        run: |
          npx pake-cli https://nexo.hakerone.ru --name Nexo --icon frontend/public/logo.png --width 1200 --height 800 --hide-window-decorations --title "Нексо"

      - name: Upload Linux app
        uses: actions/upload-artifact@v4
        with:
          name: Нексо-Linux
          path: '*.deb'
